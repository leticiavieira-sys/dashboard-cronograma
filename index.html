<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma Macro — PMO Engenharia Amarante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g-dark:#094111; --olive:#7E975B; --teal:#367F60; --sun:#F8AB2B;
  --bg:#F4F6EE; --surface:#FFFFFF; --soft:#EBF0DF; --ink:#0F2A14; --muted:#5E6F5F; --line:#DCE3CD;
  --band:#094111; --band-ink:#F4F6EE; --cur:#367F60;
  --ontime-bg:#B4C792; --ontime-bd:#7E975B; --ontime-ink:#094111;
  --late-bg:#F6C7AE; --late-bd:#E08E63; --late-ink:#5A2A0E;
  --stop-bg:#D5D5CC; --stop-bd:#9C9C90; --stop-ink:#3F3F38;
  --done-bg:#367F60; --done-bd:#2A664D; --done-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(9,65,17,.06), 0 8px 24px rgba(9,65,17,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B170E; --surface:#13241A; --soft:#1B3022; --ink:#EEF3E4; --muted:#A3B3A0; --line:#27402E;
    --band:#0E3A16; --cur:#367F60;
    --ontime-bg:#5B7440; --ontime-bd:#7E975B; --ontime-ink:#F4F8EC;
    --late-bg:#8A4B2C; --late-bd:#E08E63; --late-ink:#FDEBDD;
    --stop-bg:#45463E; --stop-bd:#7B7C70; --stop-ink:#E6E6DC;
  }
}
:root[data-theme="dark"]{
  --bg:#0B170E; --surface:#13241A; --soft:#1B3022; --ink:#EEF3E4; --muted:#A3B3A0; --line:#27402E; --band:#0E3A16;
  --ontime-bg:#5B7440; --ontime-ink:#F4F8EC; --late-bg:#8A4B2C; --late-ink:#FDEBDD; --stop-bg:#45463E; --stop-ink:#E6E6DC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Montserrat',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100%;}
::-webkit-scrollbar{height:10px;width:10px;} ::-webkit-scrollbar-thumb{background:#B8C4A2;border-radius:6px;}

.topbar{background:#fff; padding:10px clamp(16px,3vw,32px); padding-top:calc(10px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:14px; border-bottom:1px solid #E3E8D6;}
.topbar img{height:44px; width:auto; display:block;}
.topbar .sep{width:1px; height:28px; background:#DCE3CD;}
.topbar .sub{font-size:12px; font-weight:600; color:#094111; letter-spacing:.3px; text-transform:uppercase;}
.topbar .rev{margin-left:auto; font-size:12px; font-weight:600; color:#094111; background:#EEF2E2; border:1px solid #DCE3CD; padding:6px 12px; border-radius:100px;}

.band{background:var(--band); color:var(--band-ink); padding:22px clamp(16px,3vw,32px) 20px;}
.band-in{max-width:1400px; margin:0 auto; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between;}
.band h1{margin:0; font-size:clamp(22px,3vw,30px); font-weight:700; letter-spacing:-.2px;}
.band p{margin:4px 0 0; font-size:13.5px; font-weight:500; opacity:.82;}
.band p.note{margin:14px 0 0; padding-top:12px; border-top:1px solid rgba(255,255,255,.18); font-size:12.5px; line-height:1.55; opacity:.92; max-width:980px;}
.band p.note b{font-weight:700; color:var(--sun);}
.tipo{font-size:10.5px; font-weight:500; color:var(--muted);}
.pills{display:flex; gap:8px; flex-wrap:wrap;}
.pill{font-size:12px; font-weight:600; padding:7px 13px; border-radius:100px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); display:flex; align-items:center; gap:7px; color:var(--band-ink);}
.pill.today{background:var(--sun); border-color:var(--sun); color:#094111;}
button.pill{cursor:pointer; font-family:inherit;}
button.pill:hover{background:rgba(255,255,255,.2);}

.wrap{max-width:1400px; margin:0 auto; padding:18px clamp(16px,3vw,32px) 40px;}
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); margin-bottom:14px;}
.search{flex:1 1 180px; min-width:150px;}
.search input{width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line); font-family:inherit; font-size:13px; background:var(--bg); color:var(--ink);}
.search input:focus,.dd-btn:focus-visible,.chip:focus-visible,.viewtoggle button:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
.dropdown{position:relative;}
.dd-btn{display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:9px; border:1px solid var(--line); background:var(--bg); font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit;}
.dd-btn:hover{border-color:var(--olive);}
.dd-btn .count{background:var(--teal); color:#fff; font-size:10.5px; border-radius:100px; padding:2px 8px; font-weight:700;}
.dd-panel{display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:50; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:10px; min-width:240px; max-height:300px; overflow:auto;}
.dd-panel.open{display:block;}
.dd-row{display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:7px; font-size:12.5px; font-weight:500; cursor:pointer;}
.dd-row:hover{background:var(--soft);}
.dd-row input{accent-color:var(--teal); width:14px; height:14px;}
.dd-actions{padding:6px 8px 2px; border-top:1px solid var(--line); margin-top:6px;}
.dd-actions button{background:none; border:none; color:var(--teal); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; padding:0;}
.viewtoggle{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.viewtoggle button{border:none; background:var(--surface); color:var(--muted); padding:9px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit;}
.viewtoggle button.active{background:var(--g-dark); color:#fff;}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-left:auto;}
.chip{display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:100px; border:1px solid var(--line); font-size:12px; font-weight:600; cursor:pointer; background:var(--bg); color:var(--muted); font-family:inherit;}
.chip .sw{width:9px;height:9px;border-radius:3px;}
.chip.active{background:var(--surface); color:var(--ink); border-color:var(--olive);}

.summary{font-size:13px; font-weight:600; color:var(--ink); margin:0 0 12px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;}
.summary span{color:var(--muted); font-weight:500;}
.summary b{color:var(--teal);}

.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden;}
.gantt-scroll{overflow-x:auto; overflow-y:hidden; position:relative;}
.grid{display:grid; position:relative;}
.cell{padding:10px 12px; border-bottom:1px solid var(--line); font-size:12.5px; display:flex; align-items:center;}
.hdr-cell{position:sticky; top:0; background:var(--band); color:var(--band-ink); z-index:12; font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:12px; border-bottom:none;}
.hdr-left{border-right:1px solid rgba(255,255,255,.14);}
.hdr-month{justify-content:center; border-right:1px solid rgba(255,255,255,.1); white-space:nowrap; position:sticky;}
.hdr-month.cur{background:var(--cur);}
.todaytag{position:absolute; bottom:-10px; transform:translateX(-50%); background:var(--sun); color:#094111; font-size:10px; font-weight:800; padding:2px 8px; border-radius:100px; z-index:14; white-space:nowrap; letter-spacing:.3px; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.left-col{position:sticky; background:var(--surface); z-index:5;}
.c1{left:0; min-width:230px; font-weight:600; border-right:1px solid var(--line); z-index:6;}
.c2{left:230px; min-width:104px; border-right:1px solid var(--line);}
.c3{left:334px; min-width:112px; border-right:1px solid var(--line);}
.groupbar{grid-column:1 / -1; background:var(--soft); color:var(--ink); font-weight:700; font-size:12px; padding:9px 14px; border-bottom:1px solid var(--line); position:sticky; left:0; cursor:pointer; display:flex; align-items:center; gap:8px; width:max-content; min-width:100%; letter-spacing:.2px;}
.groupbar .chev{transition:transform .15s; font-size:10px; color:var(--teal);} .groupbar.collapsed .chev{transform:rotate(-90deg);}
.groupbar .n{color:var(--muted); font-weight:500;}
.statustext{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;}
.statustext .sw{width:9px;height:9px;border-radius:3px;flex:none;}
.namecell{display:flex; flex-direction:column; gap:2px; line-height:1.25;}
.resp{font-size:11px; color:var(--muted); font-weight:500;}
.track{position:relative; border-bottom:1px solid var(--line); min-height:46px;}
.mline{position:absolute; top:0; bottom:0; border-right:1px dashed var(--line);}
.bar{position:absolute; top:8px; height:30px; border-radius:7px; font-size:11px; font-weight:700; display:flex; align-items:center; padding:0 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:1px solid;}
.bar.ontime{background:var(--ontime-bg); border-color:var(--ontime-bd); color:var(--ontime-ink);}
.bar.late{background:var(--late-bg); border-color:var(--late-bd); color:var(--late-ink);}
.bar.stopped{background:var(--stop-bg); border-color:var(--stop-bd); color:var(--stop-ink);}
.bar.done{background:var(--done-bg); border-color:var(--done-bd); color:var(--done-ink);}
.noseg{position:absolute; top:14px; left:10px; font-size:11.5px; color:var(--muted); font-style:italic; white-space:nowrap;}
.todayline{position:absolute; top:0; bottom:0; width:0; border-left:2.5px solid var(--sun); z-index:4; pointer-events:none;}
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; padding:13px 16px; font-size:11.5px; font-weight:500; color:var(--muted); border-top:1px solid var(--line); align-items:center;}
.legend b{color:var(--ink); font-weight:700;}
.legend .row{display:flex; align-items:center; gap:6px;}
.legend .sw{width:12px;height:12px;border-radius:3px;border:1px solid;}
.empty{padding:44px 20px; text-align:center; color:var(--muted); font-size:13.5px; font-weight:500; grid-column:1 / -1;}
.footnote{margin-top:16px; font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; line-height:1.6;}
.footnote summary{cursor:pointer; font-weight:700; color:var(--teal);}
.footnote .body{margin-top:8px;} .footnote b{color:var(--ink);} .footnote ul{margin:6px 0 0; padding-left:18px;}

body.print .controls, body.print .footnote{display:none;}
body.print .wrap{padding-top:14px;}
@media (max-width:720px){
  .c1{min-width:190px;}
  .chips{margin-left:0; width:100%;}
}
</style>
</head>
